<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>월앤홈케어 전자명함</title>
    <meta name="description" content="월앤홈케어 대표 이영서의 모바일 전자명함 - 에어컨·냉장고 냉매충전, 입주청소, 벽걸이TV설치, 가전제품 홈케어" />
    <!-- Open Graph for KakaoTalk, LINE, Facebook, Naver (Absolute URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wnhcare.com" />
    <meta property="og:title" content="월앤홈케어 전자명함" />
    <meta property="og:description" content="월앤홈케어 대표 이영서의 모바일 전자명함 - 에어컨·냉장고 냉매충전, 입주청소, 벽걸이TV설치, 가전제품 홈케어" />
    <meta property="og:site_name" content="월앤홈케어" />
    <meta property="og:locale" content="ko_KR" />

    <!-- KakaoTalk & SNS Absolute URL Thumbnail Image -->
    <meta property="og:image" content="https://wnhcare.com/thumb.jpg" />
    <meta property="og:image:secure_url" content="https://wnhcare.com/thumb.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="월앤홈케어 전자명함 썸네일" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="월앤홈케어 전자명함" />
    <meta name="twitter:description" content="월앤홈케어 대표 이영서의 모바일 전자명함 - 에어컨·냉장고 냉매충전, 입주청소, 벽걸이TV설치, 가전제품 홈케어" />
    <meta name="twitter:image" content="https://wnhcare.com/thumb.jpg" />

    <!-- Mobile Messenger Thumbnail Links (iMessage, SMS, KakaoTalk, Daum, Naver) -->
    <meta name="thumbnail" content="https://wnhcare.com/thumb.jpg" />
    <meta itemprop="image" content="https://wnhcare.com/thumb.jpg" />
    <link rel="image_src" href="https://wnhcare.com/thumb.jpg" />

    <link rel="canonical" href="https://wnhcare.com" />
    <link rel="icon" type="image/svg+xml" href="/logo-vector.svg" />
    <link rel="apple-touch-icon" href="/logo-vector.svg" />

    <!-- Mobile Browser Security & Bot Compatibility: No-referrer-when-downgrade allows Kakao/SNS crawlers to fetch assets without blocking -->
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- Dynamic URL Sync Script -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var currentHref = (origin && origin !== 'null' && origin.indexOf('localhost') === -1) 
            ? window.location.href.replace(/^http:\/\//i, 'https://') 
            : 'https://wnhcare.com/';
          
          var thumbUrl = (origin && origin !== 'null' && origin.indexOf('localhost') === -1)
            ? origin.replace(/^http:\/\//i, 'https://') + '/thumb.jpg'
            : 'https://wnhcare.com/thumb.jpg';

          var setAttr = function(selector, attr, val) {
            var el = document.querySelector(selector);
            if (el) el.setAttribute(attr, val);
          };

          setAttr('meta[property="og:url"]', 'content', currentHref);
          setAttr('link[rel="canonical"]', 'href', currentHref);
          setAttr('meta[property="og:image"]', 'content', thumbUrl);
          setAttr('meta[property="og:image:secure_url"]', 'content', thumbUrl);
          setAttr('meta[name="twitter:image"]', 'content', thumbUrl);
          setAttr('meta[name="thumbnail"]', 'content', thumbUrl);
          setAttr('link[rel="image_src"]', 'href', thumbUrl);
        } catch (e) {
          console.error('Meta sync failed', e);
        }
      })();
    </script>
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://i.imgur.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" />
  </head>
  <body class="bg-[#0a0805] text-stone-100 antialiased selection:bg-amber-500 selection:text-stone-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
