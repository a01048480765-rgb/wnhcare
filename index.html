    <!-- Dynamic Meta Tag Sync Script -->
    <script>
      (function() {
        try {
          var directThumbUrl = 'https://wsrv.nl/?url=https://i.imgur.com/FadLgcQ.png';
          var origin = window.location.origin;
          var currentHref = (origin && origin !== 'null' && origin.indexOf('localhost') === -1) 
            ? window.location.href.replace(/^http:\/\//i, 'https://') 
            : 'https://wnhcare.com/';
          
          var setAttr = function(selector, attr, val) {
            var el = document.querySelector(selector);
            if (el) el.setAttribute(attr, val);
          };

          setAttr('meta[property="og:image"]', 'content', directThumbUrl);
          setAttr('meta[property="og:image:secure_url"]', 'content', directThumbUrl);
          setAttr('meta[name="twitter:image"]', 'content', directThumbUrl);
          setAttr('meta[name="twitter:image:src"]', 'content', directThumbUrl);
          setAttr('meta[name="thumbnail"]', 'content', directThumbUrl);
          setAttr('meta[itemprop="image"]', 'content', directThumbUrl);
          setAttr('link[rel="image_src"]', 'href', directThumbUrl);
          setAttr('link[rel="icon"]', 'href', directThumbUrl);
          setAttr('link[rel="apple-touch-icon"]', 'href', directThumbUrl);
          setAttr('meta[property="og:url"]', 'content', currentHref);
          setAttr('link[rel="canonical"]', 'href', currentHref);
        } catch (e) {
          console.error('Meta sync failed', e);
        }
      })();
    </script>
